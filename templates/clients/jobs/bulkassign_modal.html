
{% load widget_tweaks %}
<div class="modal fade" id="bulkassignModal" tabindex="-1" role="dialog" aria-labelledby="largeModal" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content modal-xl" >
            <div class="modal-header">
                <h5 class="modal-title text-uppercase">Assign Bulk Jobs</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">


                <div class="mb-3">
                   
                    <label class="form-label">Select Agent:</label>
                    {% render_field form.agent class="form-control form-select"  %}
                   
                  </div>
              
                <div class="modal-footer">
                  
                  <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                    Cancel
                  </button>
                  <button type="submit" id="bulkassign_btn"  class="btn btn-primary">Assign</button>
                </div>

            </div>
           
        </div>
    </div>
</div>
