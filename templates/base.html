      // Function to get formatted address using Google Geocoding API
      function getFormattedAddress(latitude, longitude) {
        var apiKey = 'YOUR_GOOGLE_API_KEY' // Replace with your Google API key
        var geocodeUrl = `https://maps.googleapis.com/maps/api/geocode/json?latlng=${latitude},${longitude}&key=${apiKey}`
      
        $.getJSON(geocodeUrl, function (response) {
          if (response.status === 'OK') {
            var formattedAddress = response.results[0].formatted_address
            $('#formatted_address').text(formattedAddress) // Show formatted address
          } else {
            $('#formatted_address').text('Address not found')
          }
        }).fail(function () {
          $('#formatted_address').text('Error fetching address')
        })
      }

      $(document).ready(function () {
        // Event listener for "Assign Selected" button
        $('#assign-selected').click(function () {
          // Open the modal
          $('#bulkassignModal').modal('show')
        })
      
        // Event listener for "Assign" button within the modal
        $('#bulkassign_btn').click(function (e) {
          e.preventDefault()
      
          var agentId = $('#selectedagent').val()
          var selectedJobIds = []
          $('.select-checkbox:checked').each(function () {
            selectedJobIds.push($(this).data('id'))
          })
      
          if (agentId && selectedJobIds.length > 0) {
            // Show a confirmation dialog
            if (confirm('Are you sure you want to assign the selected jobs?')) {
              // Continue with assignment if confirmed
              var csrf = $('input[name=csrfmiddlewaretoken]').val()
      
              // Prepare the form data
              var formData = new FormData()
              formData.append('csrfmiddlewaretoken', csrf)
              formData.append('agent', agentId)
              for (var i = 0; i < selectedJobIds.length; i++) {
                formData.append('job_ids[]', selectedJobIds[i])
              }
      
              // Send the assignment request
              $.ajax({
                url: '{% url "assignbulkjobs" %}', // Replace with your Django URL
                method: 'POST',
                processData: false,
                contentType: false,
                data: formData,
                success: function (response) {
                  if (response.success) {
                    // Handle success, possibly show a success message
                    location.reload() // Reload the page after assignment
                  } else {
                    alert('Failed to assign selected jobs.')
                  }
                }
              })
            }
          } else {
            alert('Make sure you Select Job and Agent!.')
          }
        })
      })
