      // Function to open Google Map with coordinates
      function openGoogleMap(lat, lng) {
        if (lat && lng) {
          const mapURL = `http://maps.google.com/maps?q=loc:${lat},${lng}`
          window.open(mapURL, '_blank')
        } else {
          alert('Latitude or Longitude is missing.')
        }
      }

        const address = $('#customeraddress').text().trim()
        if (address) {
          const directionsURL = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(address)}`
          window.open(directionsURL, '_blank')
        } else {
          alert('Customer address is missing.')
        }
      }
